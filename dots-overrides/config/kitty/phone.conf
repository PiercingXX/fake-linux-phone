# Phone overrides, included at the end of the piercing-dots kitty.conf.
# No Nerd Font family in Termux: JetBrains Mono plus the Nerd symbols fallback.
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD Symbols Nerd Font Mono
background_opacity 1.0
confirm_os_window_close 0
